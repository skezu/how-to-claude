<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
      .bg { fill: #FAF6EE; }
      .title { font-family: 'Playfair Display', Georgia, serif; font-size: 26px; fill: #2C2A29; font-weight: 600; }
      .subtitle { font-family: 'Inter', sans-serif; font-size: 11px; fill: #8C857B; letter-spacing: 0.15em; font-weight: 600; text-transform: uppercase; }
      .card-title { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; fill: #2C2A29; font-weight: 600; }
      .card-subtitle { font-family: 'Inter', sans-serif; font-size: 11px; fill: #8C857B; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
      .card-text { font-family: 'Inter', sans-serif; font-size: 13px; fill: #4A4642; font-weight: 400; }
      .card-text-bold { font-family: 'Inter', sans-serif; font-size: 13px; fill: #2C2A29; font-weight: 600; }
      .card-tag { font-family: 'Inter', sans-serif; font-size: 9px; fill: #8C857B; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      .arrow-line { stroke: #9E978C; stroke-width: 1.0; fill: none; }
      .arrow-head { fill: #9E978C; }
      .connection-dash { stroke: #BFB7AA; stroke-width: 1.0; stroke-dasharray: 4 4; fill: none; }
      .border-fine { stroke: #9E978C; stroke-width: 0.8; }
      .fill-terracotta { fill: #F7EFEA; stroke: #C85A3C; stroke-width: 1.0; }
      .fill-ocre { fill: #FAF3E6; stroke: #D2963F; stroke-width: 1.0; }
      .fill-sand { fill: #F4EFE6; stroke: #9E978C; stroke-width: 1.0; }
      .fill-cream { fill: #FAF8F5; stroke: #E4E0D5; stroke-width: 1.0; }
      .fill-white { fill: #FFFFFF; stroke: #E4E0D5; stroke-width: 1.0; }
      .code-font { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #C85A3C; font-weight: bold; }
      .arrow-text { font-family: 'Inter', sans-serif; font-size: 10px; fill: #8C857B; font-weight: 500; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#9E978C" />
    </marker>
  </defs>
  <rect width="900" height="550" class="bg" />
  
  <!-- Header -->
  <text x="60" y="65" class="title">04. Déclenchement d'une Skill</text>
  <text x="60" y="90" class="subtitle">PROCESSUS SÉMANTIQUE DE CHARGEMENT DE CONTEXTE DYNAMIQUE</text>
  <line x1="60" y1="105" x2="840" y2="105" stroke="#E4E0D5" stroke-width="1" />
  <rect x="70" y="190" width="210" height="210" rx="6" class="fill-sand" />
  <text x="90" y="212" class="card-tag">1. DÉCLENCHEUR</text>
  <text x="90" y="230" class="card-title">Requête Utilisateur</text>
  <line x1="90" y1="242" x2="260" y2="242" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="90" y="264" class="card-text">Une tâche est soumise :</text>
  <text x="90" y="282" class="card-text">« Crée une suite de tests</text>
  <text x="90" y="300" class="card-text">pour ce module. »</text>
  <text x="90" y="318" class="card-text"></text>
  <text x="90" y="336" class="card-text">L'intention évoque une</text>
  <text x="90" y="354" class="card-text">procédure spécifique.</text>
  <rect x="345" y="170" width="210" height="250" rx="6" class="fill-ocre" />
  <text x="365" y="192" class="card-tag">2. COMPARAISON</text>
  <text x="365" y="210" class="card-title">Recherche Sémantique</text>
  <line x1="365" y1="222" x2="535" y2="222" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="365" y="244" class="card-text">Claude examine les</text>
  <text x="365" y="262" class="card-text">descriptions déclarées dans :</text>
  <text x="365" y="280" class="code-font">.claude/skills/*/</text>
  <text x="365" y="298" class="card-text"></text>
  <text x="365" y="316" class="card-text">Il compare sémantiquement</text>
  <text x="365" y="334" class="card-text">le prompt avec la</text>
  <text x="365" y="352" class="card-text">description de la skill</text>
  <text x="365" y="370" class="card-text">pour valider son utilité.</text>
  <rect x="620" y="190" width="210" height="210" rx="6" class="fill-terracotta" />
  <text x="640" y="212" class="card-tag">3. INJECTION</text>
  <text x="640" y="230" class="card-title">Skill Activable</text>
  <line x1="640" y1="242" x2="810" y2="242" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="640" y="264" class="card-text">La skill correspondante</text>
  <text x="640" y="282" class="card-text">est chargée automatiquement.</text>
  <text x="640" y="300" class="card-text">Ses instructions,</text>
  <text x="640" y="318" class="card-text">templates et scripts</text>
  <text x="640" y="336" class="card-text">enrichissent le contexte.</text>
  <line x1="280" y1="295" x2="345" y2="295" class="arrow-line" marker-end="url(#arrow)" />
  <line x1="555" y1="295" x2="620" y2="295" class="arrow-line" marker-end="url(#arrow)" />

</svg>