<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
      .bg { fill: #FAF6EE; }
      .title { font-family: 'Playfair Display', Georgia, serif; font-size: 26px; fill: #2C2A29; font-weight: 600; }
      .subtitle { font-family: 'Inter', sans-serif; font-size: 11px; fill: #8C857B; letter-spacing: 0.15em; font-weight: 600; text-transform: uppercase; }
      .card-title { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; fill: #2C2A29; font-weight: 600; }
      .card-subtitle { font-family: 'Inter', sans-serif; font-size: 11px; fill: #8C857B; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
      .card-text { font-family: 'Inter', sans-serif; font-size: 13px; fill: #4A4642; font-weight: 400; }
      .card-text-bold { font-family: 'Inter', sans-serif; font-size: 13px; fill: #2C2A29; font-weight: 600; }
      .card-tag { font-family: 'Inter', sans-serif; font-size: 9px; fill: #8C857B; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      .arrow-line { stroke: #9E978C; stroke-width: 1.0; fill: none; }
      .arrow-head { fill: #9E978C; }
      .connection-dash { stroke: #BFB7AA; stroke-width: 1.0; stroke-dasharray: 4 4; fill: none; }
      .border-fine { stroke: #9E978C; stroke-width: 0.8; }
      .fill-terracotta { fill: #F7EFEA; stroke: #C85A3C; stroke-width: 1.0; }
      .fill-ocre { fill: #FAF3E6; stroke: #D2963F; stroke-width: 1.0; }
      .fill-sand { fill: #F4EFE6; stroke: #9E978C; stroke-width: 1.0; }
      .fill-cream { fill: #FAF8F5; stroke: #E4E0D5; stroke-width: 1.0; }
      .fill-white { fill: #FFFFFF; stroke: #E4E0D5; stroke-width: 1.0; }
      .code-font { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #C85A3C; font-weight: bold; }
      .arrow-text { font-family: 'Inter', sans-serif; font-size: 10px; fill: #8C857B; font-weight: 500; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#9E978C" />
    </marker>
  </defs>
  <rect width="900" height="550" class="bg" />
  
  <!-- Header -->
  <text x="60" y="65" class="title">06. Model Context Protocol</text>
  <text x="60" y="90" class="subtitle">ARCHITECTURE D'INTÉGRATION DU PROTOCOLE MCP</text>
  <line x1="60" y1="105" x2="840" y2="105" stroke="#E4E0D5" stroke-width="1" />
  <rect x="70" y="180" width="210" height="230" rx="6" class="fill-sand" />
  <text x="90" y="202" class="card-tag">CLIENT (HOST)</text>
  <text x="90" y="220" class="card-title">Claude Code / IDE</text>
  <line x1="90" y1="232" x2="260" y2="232" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="90" y="254" class="card-text">• Formule la pensée de l'IA</text>
  <text x="90" y="272" class="card-text">• Requiert des outils</text>
  <text x="90" y="290" class="card-text">• Affiche les interfaces</text>
  <text x="90" y="308" class="card-text">• Gère la sécurité et</text>
  <text x="90" y="326" class="card-text">  les confirmations</text>
  <rect x="345" y="220" width="210" height="150" rx="6" class="fill-cream" />
  <text x="365" y="242" class="card-tag">PROTOCOLE MCP</text>
  <text x="365" y="260" class="card-title">JSON-RPC Bridge</text>
  <line x1="365" y1="272" x2="535" y2="272" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="365" y="294" class="card-text">Format d'échange ouvert :</text>
  <text x="365" y="312" class="card-text">• Tools (Actions)</text>
  <text x="365" y="330" class="card-text">• Resources (Données)</text>
  <text x="365" y="348" class="card-text">• Prompts (Modèles)</text>
  <rect x="620" y="180" width="210" height="230" rx="6" class="fill-terracotta" />
  <text x="640" y="202" class="card-tag">SERVEURS MCP</text>
  <text x="640" y="220" class="card-title">Sources Externes</text>
  <line x1="640" y1="232" x2="810" y2="232" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="640" y="254" class="card-text">• API GitHub &amp; GitLab</text>
  <text x="640" y="272" class="card-text">• Bases de données locales</text>
  <text x="640" y="290" class="card-text">• Systèmes de tickets (Jira)</text>
  <text x="640" y="308" class="card-text">• Moteurs de recherche web</text>
  <text x="640" y="326" class="card-text">• Serveurs personnalisés</text>
  <line x1="280" y1="275" x2="345" y2="275" class="arrow-line" marker-end="url(#arrow)" />
  <line x1="345" y1="315" x2="280" y2="315" class="arrow-line" marker-end="url(#arrow)" />
  <line x1="555" y1="275" x2="620" y2="275" class="arrow-line" marker-end="url(#arrow)" />
  <line x1="620" y1="315" x2="555" y2="315" class="arrow-line" marker-end="url(#arrow)" />

</svg>