<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
      .bg { fill: #FAF6EE; }
      .title { font-family: 'Playfair Display', Georgia, serif; font-size: 26px; fill: #2C2A29; font-weight: 600; }
      .subtitle { font-family: 'Inter', sans-serif; font-size: 11px; fill: #8C857B; letter-spacing: 0.15em; font-weight: 600; text-transform: uppercase; }
      .card-title { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; fill: #2C2A29; font-weight: 600; }
      .card-subtitle { font-family: 'Inter', sans-serif; font-size: 11px; fill: #8C857B; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
      .card-text { font-family: 'Inter', sans-serif; font-size: 13px; fill: #4A4642; font-weight: 400; }
      .card-text-bold { font-family: 'Inter', sans-serif; font-size: 13px; fill: #2C2A29; font-weight: 600; }
      .card-tag { font-family: 'Inter', sans-serif; font-size: 9px; fill: #8C857B; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      .arrow-line { stroke: #9E978C; stroke-width: 1.0; fill: none; }
      .arrow-head { fill: #9E978C; }
      .connection-dash { stroke: #BFB7AA; stroke-width: 1.0; stroke-dasharray: 4 4; fill: none; }
      .border-fine { stroke: #9E978C; stroke-width: 0.8; }
      .fill-terracotta { fill: #F7EFEA; stroke: #C85A3C; stroke-width: 1.0; }
      .fill-ocre { fill: #FAF3E6; stroke: #D2963F; stroke-width: 1.0; }
      .fill-sand { fill: #F4EFE6; stroke: #9E978C; stroke-width: 1.0; }
      .fill-cream { fill: #FAF8F5; stroke: #E4E0D5; stroke-width: 1.0; }
      .fill-white { fill: #FFFFFF; stroke: #E4E0D5; stroke-width: 1.0; }
      .code-font { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #C85A3C; font-weight: bold; }
      .arrow-text { font-family: 'Inter', sans-serif; font-size: 10px; fill: #8C857B; font-weight: 500; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#9E978C" />
    </marker>
  </defs>
  <rect width="900" height="550" class="bg" />
  
  <!-- Header -->
  <text x="60" y="65" class="title">00. Les Trois Visages de Claude</text>
  <text x="60" y="90" class="subtitle">CHAT, COWORK &amp; CODE — TROIS FAÇONS DE TRAVAILLER AVEC L'IA</text>
  <line x1="60" y1="105" x2="840" y2="105" stroke="#E4E0D5" stroke-width="1" />
  <rect x="60" y="160" width="230" height="310" rx="6" class="fill-cream" />
  <text x="80" y="182" class="card-tag">CONVERSATIONNEL / WEB</text>
  <text x="80" y="200" class="card-title">Claude Chat</text>
  <line x1="80" y1="212" x2="270" y2="212" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="80" y="234" class="card-text">Interface web et mobile.</text>
  <text x="80" y="252" class="card-text"></text>
  <text x="80" y="270" class="card-text">• Réponses textuelles fluides</text>
  <text x="80" y="288" class="card-text">• Analyse de documents (PDF, CSV)</text>
  <text x="80" y="306" class="card-text">• Idées, brainstormings, e-mails</text>
  <text x="80" y="324" class="card-text">• Pas d'accès au système local</text>
  <text x="80" y="342" class="card-text">• Copier-coller manuel requis</text>
  <rect x="335" y="160" width="230" height="310" rx="6" class="fill-ocre" />
  <text x="355" y="182" class="card-tag">COLLABORATIF / ESPACE</text>
  <text x="355" y="200" class="card-title">Cowork</text>
  <line x1="355" y1="212" x2="545" y2="212" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="355" y="234" class="card-text">Agent hybride connecté au projet.</text>
  <text x="355" y="252" class="card-text"></text>
  <text x="355" y="270" class="card-text">• Modifie directement les fichiers</text>
  <text x="355" y="288" class="card-text">• Lecture intelligente de l'espace</text>
  <text x="355" y="306" class="card-text">• Interface visuelle interactive</text>
  <text x="355" y="324" class="card-text">• Exécution sécurisée</text>
  <text x="355" y="342" class="card-text">• Parfait pour l'édition guidée</text>
  <rect x="610" y="160" width="230" height="310" rx="6" class="fill-terracotta" />
  <text x="630" y="182" class="card-tag">DÉVELOPPEUR / CLI</text>
  <text x="630" y="200" class="card-title">Claude Code</text>
  <line x1="630" y1="212" x2="820" y2="212" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="630" y="234" class="card-text">Client terminal ultra-rapide.</text>
  <text x="630" y="252" class="card-text"></text>
  <text x="630" y="270" class="card-text">• Lecture et écriture de fichiers</text>
  <text x="630" y="288" class="card-text">• Lance tests, linters, commandes</text>
  <text x="630" y="306" class="card-text">• Boucle de décision autonome</text>
  <text x="630" y="324" class="card-text">• Utilisation en ligne de commande</text>
  <text x="630" y="342" class="card-text">• Vitesse de dev maximale</text>

</svg>