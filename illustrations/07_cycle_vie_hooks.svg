<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
      .bg { fill: #FAF6EE; }
      .title { font-family: 'Playfair Display', Georgia, serif; font-size: 26px; fill: #2C2A29; font-weight: 600; }
      .subtitle { font-family: 'Inter', sans-serif; font-size: 11px; fill: #8C857B; letter-spacing: 0.15em; font-weight: 600; text-transform: uppercase; }
      .card-title { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; fill: #2C2A29; font-weight: 600; }
      .card-subtitle { font-family: 'Inter', sans-serif; font-size: 11px; fill: #8C857B; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
      .card-text { font-family: 'Inter', sans-serif; font-size: 13px; fill: #4A4642; font-weight: 400; }
      .card-text-bold { font-family: 'Inter', sans-serif; font-size: 13px; fill: #2C2A29; font-weight: 600; }
      .card-tag { font-family: 'Inter', sans-serif; font-size: 9px; fill: #8C857B; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      .arrow-line { stroke: #9E978C; stroke-width: 1.0; fill: none; }
      .arrow-head { fill: #9E978C; }
      .connection-dash { stroke: #BFB7AA; stroke-width: 1.0; stroke-dasharray: 4 4; fill: none; }
      .border-fine { stroke: #9E978C; stroke-width: 0.8; }
      .fill-terracotta { fill: #F7EFEA; stroke: #C85A3C; stroke-width: 1.0; }
      .fill-ocre { fill: #FAF3E6; stroke: #D2963F; stroke-width: 1.0; }
      .fill-sand { fill: #F4EFE6; stroke: #9E978C; stroke-width: 1.0; }
      .fill-cream { fill: #FAF8F5; stroke: #E4E0D5; stroke-width: 1.0; }
      .fill-white { fill: #FFFFFF; stroke: #E4E0D5; stroke-width: 1.0; }
      .code-font { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #C85A3C; font-weight: bold; }
      .arrow-text { font-family: 'Inter', sans-serif; font-size: 10px; fill: #8C857B; font-weight: 500; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#9E978C" />
    </marker>
  </defs>
  <rect width="900" height="550" class="bg" />
  
  <!-- Header -->
  <text x="60" y="65" class="title">07. Cycle de Vie des Hooks</text>
  <text x="60" y="90" class="subtitle">INTERCEPTIONS ET GARANTIES DÉTERMINISTES EN SESSION</text>
  <line x1="60" y1="105" x2="840" y2="105" stroke="#E4E0D5" stroke-width="1" />
  <rect x="50" y="190" width="135" height="190" rx="6" class="fill-cream" />
  <text x="70" y="212" class="card-tag">SESSION</text>
  <text x="70" y="230" class="card-title">Démarrage</text>
  <line x1="70" y1="242" x2="165" y2="242" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="70" y="264" class="card-text">Lancement de session</text>
  <text x="70" y="282" class="card-text"></text>
  <text x="70" y="300" class="code-font">on-session-start</text>
  <rect x="215" y="190" width="135" height="190" rx="6" class="fill-sand" />
  <text x="235" y="212" class="card-tag">PROMPT</text>
  <text x="235" y="230" class="card-title">Prompt</text>
  <line x1="235" y1="242" x2="330" y2="242" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="235" y="264" class="card-text">Saisie utilisateur</text>
  <text x="235" y="282" class="card-text">avant traitement</text>
  <rect x="380" y="190" width="140" height="190" rx="6" class="fill-ocre" />
  <text x="400" y="212" class="card-tag">COMMANDE</text>
  <text x="400" y="230" class="card-title">Exécution</text>
  <line x1="400" y1="242" x2="500" y2="242" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="400" y="264" class="code-font">pre-command</text>
  <text x="400" y="282" class="card-text"></text>
  <text x="400" y="300" class="card-text">Lancement commande</text>
  <text x="400" y="318" class="card-text"></text>
  <text x="400" y="336" class="code-font">post-command</text>
  <rect x="550" y="190" width="135" height="190" rx="6" class="fill-terracotta" />
  <text x="570" y="212" class="card-tag">EXCEPTION</text>
  <text x="570" y="230" class="card-title">Erreur</text>
  <line x1="570" y1="242" x2="665" y2="242" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="570" y="264" class="card-text">Échec d'exécution</text>
  <text x="570" y="282" class="card-text"></text>
  <text x="570" y="300" class="code-font">on-error</text>
  <rect x="715" y="190" width="135" height="190" rx="6" class="fill-cream" />
  <text x="735" y="212" class="card-tag">QUITTER</text>
  <text x="735" y="230" class="card-title">Fermeture</text>
  <line x1="735" y1="242" x2="830" y2="242" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="735" y="264" class="card-text">Fin de session</text>
  <text x="735" y="282" class="card-text">Sauvegarde logs</text>
  <line x1="185" y1="285" x2="215" y2="285" class="arrow-line" marker-end="url(#arrow)" />
  <line x1="350" y1="285" x2="380" y2="285" class="arrow-line" marker-end="url(#arrow)" />
  <line x1="520" y1="285" x2="550" y2="285" class="arrow-line" marker-end="url(#arrow)" />
  <line x1="685" y1="285" x2="715" y2="285" class="arrow-line" marker-end="url(#arrow)" />

</svg>