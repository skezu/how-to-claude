<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
      .bg { fill: #FAF6EE; }
      .title { font-family: 'Playfair Display', Georgia, serif; font-size: 26px; fill: #2C2A29; font-weight: 600; }
      .subtitle { font-family: 'Inter', sans-serif; font-size: 11px; fill: #8C857B; letter-spacing: 0.15em; font-weight: 600; text-transform: uppercase; }
      .card-title { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; fill: #2C2A29; font-weight: 600; }
      .card-subtitle { font-family: 'Inter', sans-serif; font-size: 11px; fill: #8C857B; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
      .card-text { font-family: 'Inter', sans-serif; font-size: 13px; fill: #4A4642; font-weight: 400; }
      .card-text-bold { font-family: 'Inter', sans-serif; font-size: 13px; fill: #2C2A29; font-weight: 600; }
      .card-tag { font-family: 'Inter', sans-serif; font-size: 9px; fill: #8C857B; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      .arrow-line { stroke: #9E978C; stroke-width: 1.0; fill: none; }
      .arrow-head { fill: #9E978C; }
      .connection-dash { stroke: #BFB7AA; stroke-width: 1.0; stroke-dasharray: 4 4; fill: none; }
      .border-fine { stroke: #9E978C; stroke-width: 0.8; }
      .fill-terracotta { fill: #F7EFEA; stroke: #C85A3C; stroke-width: 1.0; }
      .fill-ocre { fill: #FAF3E6; stroke: #D2963F; stroke-width: 1.0; }
      .fill-sand { fill: #F4EFE6; stroke: #9E978C; stroke-width: 1.0; }
      .fill-cream { fill: #FAF8F5; stroke: #E4E0D5; stroke-width: 1.0; }
      .fill-white { fill: #FFFFFF; stroke: #E4E0D5; stroke-width: 1.0; }
      .code-font { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #C85A3C; font-weight: bold; }
      .arrow-text { font-family: 'Inter', sans-serif; font-size: 10px; fill: #8C857B; font-weight: 500; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#9E978C" />
    </marker>
  </defs>
  <rect width="900" height="550" class="bg" />
  
  <!-- Header -->
  <text x="60" y="65" class="title">01. La Boucle Agentique</text>
  <text x="60" y="90" class="subtitle">COMMENT CLAUDE CODE RÉSOUT UNE TÂCHE DE MANIÈRE ITÉRATIVE</text>
  <line x1="60" y1="105" x2="840" y2="105" stroke="#E4E0D5" stroke-width="1" />
  <rect x="350" y="110" width="200" height="110" rx="6" class="fill-sand" />
  <text x="370" y="132" class="card-tag">ÉTAPE 1</text>
  <text x="370" y="150" class="card-title">Observer</text>
  <line x1="370" y1="162" x2="530" y2="162" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="370" y="184" class="card-text">Lit le code, git status,</text>
  <text x="370" y="202" class="card-text">recherche de fichiers.</text>
  <rect x="580" y="230" width="200" height="110" rx="6" class="fill-ocre" />
  <text x="600" y="252" class="card-tag">ÉTAPE 2</text>
  <text x="600" y="270" class="card-title">Planifier</text>
  <line x1="600" y1="282" x2="760" y2="282" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="600" y="304" class="card-text">Conçoit la modification,</text>
  <text x="600" y="322" class="card-text">définit les étapes clés.</text>
  <rect x="350" y="360" width="200" height="110" rx="6" class="fill-terracotta" />
  <text x="370" y="382" class="card-tag">ÉTAPE 3</text>
  <text x="370" y="400" class="card-title">Agir</text>
  <line x1="370" y1="412" x2="530" y2="412" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="370" y="434" class="card-text">Modifie les fichiers,</text>
  <text x="370" y="452" class="card-text">lance les commandes.</text>
  <rect x="120" y="230" width="200" height="110" rx="6" class="fill-sand" />
  <text x="140" y="252" class="card-tag">ÉTAPE 4</text>
  <text x="140" y="270" class="card-title">Valider</text>
  <line x1="140" y1="282" x2="300" y2="282" stroke="#E4E0D5" stroke-width="0.8" />
  <text x="140" y="304" class="card-text">Exécute tests & linter,</text>
  <text x="140" y="322" class="card-text">corrige si nécessaire.</text>

  <circle cx="450" cy="285" r="45" class="fill-cream" stroke="#E4E0D5" stroke-width="1"/>
  <text x="450" y="282" class="card-tag" text-anchor="middle">BOUCLE</text>
  <text x="450" y="295" class="card-text-bold" text-anchor="middle">AGENTIQUE</text>
  <line x1="450" y1="220" x2="450" y2="240" class="arrow-line" marker-end="url(#arrow)" />
  <line x1="450" y1="330" x2="450" y2="360" class="arrow-line" marker-end="url(#arrow)" />
  <line x1="500" y1="220" x2="580" y2="250" class="arrow-line" marker-end="url(#arrow)" />
  <line x1="600" y1="340" x2="520" y2="360" class="arrow-line" marker-end="url(#arrow)" />
  <line x1="390" y1="360" x2="310" y2="340" class="arrow-line" marker-end="url(#arrow)" />
  <line x1="300" y1="230" x2="380" y2="220" class="arrow-line" marker-end="url(#arrow)" />

</svg>